{% block title %}多只生成种子检查{% endblock %}

{% block head %}
	<script type="module" src="static/js/jquery.min.mjs"></script>
	<script type="module">
	$(document).ready(function(e){
		var zhg = window.zhGroup || function (s) { return s; };

		function get_json_data(id, parent_id) {
			var html_code = '';
			$.getJSON('static/resources/groupids.json', function(data) {
				html_code += '<option value="49">选择生成点：</option>';
				$.each(data, function(key, value) {
					if (value.parent_id == parent_id) {
						html_code += '<option value="' + value.id + '">' + zhg(value.name) + '</option>';
					}
				});
				$('#' + id).html(html_code);
			});
		}
		
		get_json_data('groupID',0);
	});
	</script>
	<script type="module" src="{{ url_for('static', filename='js/modules/zh-names.mjs') }}"></script>
{% endblock %}

{% block sidebar %}
    <section class="pla-section-options">
		<div class="pla-control">
            <label for="inputseed">种子</label>
            <div class="pla-seed-row">
                <button type="button" class="pla-button pla-seed-import"
                        data-import-seed
                        title="从 pokeldn 插件 junli-pla-mmo-seed 的 latest_seed.txt 读取最新种子">导入</button>
                <input type="number" id="inputseed" placeholder="输入种子">
            </div>
        </div>
		
        <div class="pla-control">
            <label for="maxDepth">最大刷新次数：</label>
            <select id="maxDepth">
                <option value="5">5</option>
                <option value="9">9</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
				<option value="18">18</option>
            </select>
        </div>
		
		<div class="pla-control">
			<label for="maxAlive">同时生成数量：</label>
			<select id="maxAlive">
				<option value="2">2</option>
				<option value="3">3</option>
			</select>
		</div>
		
		<div class="pla-control">
			<label for="groupID">选择生成点：</label>
			<select name="groupID" id="groupID" class="form-control">
				<option value="49">选择生成点</option>
			</select>
		</div>
		
		<div class="pla-control-spaced">
			<label for="nightToggle">检查夜间生成：</label>
			<input type="checkbox" id="nightToggle">
		</div>
		
		<div class="pla-control">
			<label for="selectfilter">筛选条件：</label>
			<select id="selectfilter">
				<option value="is_shiny">仅闪光</option>
				<option value="is_square_shiny">仅方块闪光</option>
				<option value="is_alpha">仅头目</option>
				<option value="is_perfect">仅 6V</option>
				<option value="has_5ivs">5V 及以上</option>
				<option value="no_attack">0 攻击个体</option>
				<option value="has_no_attack_5iv_over_30">0 攻击 + 5V（30 以上）</option>
				<option value="has_no_attack_5iv">0 攻击 + 5V</option>
				<option value="no_speed">0 速度个体</option>
				<option value="has_no_speed_5iv_over_30">0 速度 + 5V（30 以上）</option>
				<option value="has_no_speed_5iv">0 速度 + 5V</option>
				<option value="has_6iv_over_30">6 项 30 以上</option>
				<option value="has_5iv_over_30">5 项 30 以上</option>
				<option value="has_no_speed_no_attack">0 速度 + 0 攻击</option>
				<option value="has_no_speed_no_attack_4iv_over_30">0 速度 + 0 攻击，4V（30 以上）</option>
				<option value="has_no_speed_no_attack_4iv">0 速度 + 0 攻击，4V</option>
			</select>
		</div>
        
        <div class="pla-control-actions">
            <button class="pla-button pla-button-action" id="pla-button-checkmultiseed">按种子检查多只生成</button>
        </div>
    </section>

	<section>
        <!--<div class="pla-control-spaced">

{% block templates %}
    <template data-pla-results-template>
        <div class="pla-results-item" data-pla-results-template>
            <ul class="pla-results-heading pla-results-ul">
                <li class="pla-results-sprite" data-pla-results-sprite></li>
                <li class="pla-results-species" data-pla-results-species></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">闪光：</span> <span class="float -left" data-pla-results-shinysprite><span class="float -right" data-pla-results-shiny></span></span></li>
                <li><span class="pla-results-label">头目：</span> <span data-pla-results-alpha></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label"><span data-pla-results-location></span></span></li>
            </ul>
            
			<ul class="pla-results-ul">
				<li><span class="pla-results-label">帧数：</span> <span data-pla-results-adv></span></li>
			</ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">性格：</span> <span data-pla-results-nature></span></li>
                <li><span class="pla-results-label">性别：</span> <span data-pla-results-gender></span></li>
                <li><span class="pla-results-label">判定次数：</span> <span data-pla-results-rolls></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">EC：</span> <span data-pla-results-ec></span></li>
                <li><span class="pla-results-label">PID：</span> <span data-pla-results-pid></span></li>
            </ul>

            <div class="pla-results-ivs-container">
                <span class="pla-results-label">个体值：</span>
                <ul class="pla-results-ivs">
                    <li class="pla-results-ivs-hp" data-pla-results-ivs-hp></li>
                    <li class="pla-results-ivs-att" data-pla-results-ivs-att></li>
                    <li class="pla-results-ivs-def" data-pla-results-ivs-def></li>
                    <li class="pla-results-ivs-spa" data-pla-results-ivs-spa></li>
                    <li class="pla-results-ivs-spd" data-pla-results-ivs-spd></li>
                    <li class="pla-results-ivs-spe" data-pla-results-ivs-spe></li>
                </ul>
            </div>
            
            </div>
        </div>
    </template>
{% endblock %}

{% block script %}
    <script type="module" src="{{ url_for('static', filename='js/import-seed.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/multiseed.js') }}"></script>
{% endblock %}
