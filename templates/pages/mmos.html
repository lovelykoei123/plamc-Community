{% extends "base/base-sidebar.html" %}

{% block title %}大量出现检查器{% endblock %}

{% block main %}
    <section class="pla-section-results">
        <div data-pla-messages></div>
        <div class="pla-results" data-pla-results>
            <p class="pla-results-message">点击左侧按钮开始搜索</p>
        </div>
    </section>
{% endblock %}

{% block sidebar %}
    <section class="pla-section-options">
        <div class="pla-control-actions">
            <button class="pla-button pla-button-action" id="pla-button-checkmmos">检查全部大量出现</button>
        </div>

        <div class="pla-control-actions">
            <div class="pla-control">
                <label for="mapSelect">选择当前生效的地图</label>
                <select id="mapSelect">
                </select>
            </div>
            <button class="pla-button pla-button-action" id="pla-button-checkonemap">仅检查该地图</button>
        </div>

        <!--<div class="pla-control-spaced">
            <label for="inmapcheck">所在区域（暂不可用）</label>
            <input type="checkbox" id="inmapcheck">
        </div>-->
        
        <div class="pla-control-actions">
            <button class="pla-button pla-button-action" id="pla-button-checkoutbreaks">检查普通大量发生</button>
        </div>
    </section>

    <section>
        <div class="pla-control-spaced">
            <label for="mmoShinyFilter">闪光或头目</label>
            <input type="checkbox" id="mmoShinyOrAlphaFilter">
        </div>

        <div class="pla-control-spaced">
            <label for="mmoShinyFilter">仅闪光</label>
            <input type="checkbox" id="mmoShinyFilter">
        </div>

        <div class="pla-control-spaced">
            <label for="mmoAlphaFilter">仅头目</label>
            <input type="checkbox" id="mmoAlphaFilter">
        </div>
        
        <div class="pla-control-spaced">
            <label for="mmoDefaultRouteFilter">仅显示默认路径</label>
            <input type="checkbox" id="mmoDefaultRouteFilter">
        </div>
		
		<div class="pla-control-spaced">
            <label for="mmoDefaultRouteFilter">仅显示多闪路径</label>
            <input type="checkbox" id="mmoMultiFilter">
        </div>
        
        <div class="pla-control">
            <label for="mmoSpeciesFilter">物种筛选：</label>
            <input type="text" id="mmoSpeciesFilter">
        </div>
    </section>

    <section class="pla-section-info">
        <h3>大量出现地点</h3>
        <ul class="pla-info-list" data-pla-info-locations>
        
        </ul>
        
        <h3>普通大量发生</h3>
        <ul class="pla-info-list" data-pla-info-spawns>

        </ul>
                    
        <div class="pla-control-actions">
            <button class="pla-button pla-button-action" id="pla-button-checkmaps">刷新地图</button>
        </div>
    </section>
{% endblock %}

{% block templates %}
    <template data-pla-results-template>
        <div class="pla-results-item" data-pla-results-template>
            <ul class="pla-results-heading pla-results-ul">
                <li class="pla-results-sprite" data-pla-results-sprite></li>
                <li class="pla-results-species" data-pla-results-species></li>
                <li>位于 <span class="pla-results-mapname" data-pla-results-mapname></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">闪光：</span> <span class="float -left" data-pla-results-shinysprite><span class="float -right" data-pla-results-shiny></span></span></li>
                <li><span class="pla-results-label">头目：</span> <span data-pla-results-alpha></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">群组：</span> <span data-pla-results-group></span></li>
                <li><span class="pla-results-label">第一轮生成数量：</span><span data-pla-results-numspawns></span></li>
            </ul>
            <ul class="pla-results-ul">
                <li><span class="pla-results-label"><span data-pla-results-location></span></span></li>
            </ul>
			<!--<button type="button" class="collapsible">查看重复路径</button>
			<div class="content">-->
			<ul class="pla-results-ul">
				<li><span class="pla-results-label">连锁：<span data-pla-info-chains></span></span></li>
			</ul>
            <ul class="pla-results-ul">
                <li><span class="pla-results-label">重复项：<span data-pla-results-dupes></span></span></li>
            </ul>
            <ul class="pla-results-ul">
                <li><span class="pla-results-label">性格：</span> <span data-pla-results-nature></span></li>
                <li><span class="pla-results-label">性别：</span> <span data-pla-results-gender></span></li>
                <li><span class="pla-results-label">判定次数：</span> <span data-pla-results-rolls></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">种子：</span> <span data-pla-results-seed></span></li>
                <li><span class="pla-results-label">EC：</span> <span data-pla-results-ec></span></li>
                <li><span class="pla-results-label">PID：</span> <span data-pla-results-pid></span></li>
            </ul>

            <div class="pla-results-ivs-container">
                <span class="pla-results-label">个体值：</span>
                <ul class="pla-results-ivs">
                    <li class="pla-results-ivs-hp" data-pla-results-ivs-hp></li>
                    <li class="pla-results-ivs-att" data-pla-results-ivs-att></li>
                    <li class="pla-results-ivs-def" data-pla-results-ivs-def></li>
                    <li class="pla-results-ivs-spa" data-pla-results-ivs-spa></li>
                    <li class="pla-results-ivs-spd" data-pla-results-ivs-spd></li>
                    <li class="pla-results-ivs-spe" data-pla-results-ivs-spe></li>
                </ul>
            </div>
            
            <div class="pla-results-teleport">
            </div>
        </div>
    </template>
{% endblock %}

{% block script %}
    <script type="module" src="{{ url_for('static', filename='js/mmos.js') }}"></script>
{% endblock %}
