{% extends "base/base-sidebar.html" %}

{% block title %}野生检查{% endblock %}

{% block head %}
{% endblock %}

{% block main %}
<section class="pla-section-results">
        <div data-pla-messages></div>
        <div class="pla-results" data-pla-results>
            <p class="pla-results-message">点击左侧按钮开始搜索</p>
        </div>
    </section>
{% endblock %}

{% block sidebar %}
    <section class="pla-section-options">
		<div class="pla-control">
            <label for="inputs0">S0</label>
            <input id="inputs0" placeholder="输入 S[0]">
        </div>
		
		<div class="pla-control">
            <label for="inputs1">S1</label>
            <input id="inputs1" placeholder="输入 S[1]">
        </div>
		
		<div class="pla-control">
            <label for="inputs2">S2</label>
            <input id="inputs2" placeholder="输入 S[2]">
        </div>
		
		<div class="pla-control">
            <label for="inputs3">S3</label>
            <input id="inputs3" placeholder="输入 S[3]">
        </div>
		
		<div class="pla-control">
            <label for="minadvances">起始帧数：</label>
            <input type="number" id="minadvances" placeholder="帧数">
        </div>
		
		<div class="pla-control">
            <label for="advances">最大帧数：</label>
            <input type="number" id="advances" placeholder="帧数">
        </div>		
		
		<div class="pla-control">
            <label for="delay">延迟（Delay）：</label>
            <input type="number" id="delay" placeholder="延迟">
        </div>
		
		<div class="pla-control-spaced">
			<label for="3iv">保底 3V？</label>
			<input type="checkbox" id="3iv">
		</div>
		
		<div class="pla-control-spaced">
			<label for="fixedgender">性别固定？</label>
			<input type="checkbox" id="fixedgender">
		</div>
		
		<button type="button" class="pla-button expandable-control">高级选项</button>
			<div class="expandable">
			
			<label>最小个体值：</label>
			<div class="pla-control-spaced">
				<input type="number" id="minhp" placeholder="HP" size="2" min="0" max="31" class="ivbox"> <input type="number" id="minatk" placeholder="攻击" size="2" min="0" max="31" class="ivbox"> <input type="number" id="mindef" placeholder="防御" size="2" min="0" max="31" class="ivbox"><input type="number" id="minspa" placeholder="特攻" size="2" min="0" max="31" class="ivbox"> <input type="number" id="minspd" placeholder="特防" size="2" min="0" max="31" class="ivbox"> <input type="number" id="minspe" placeholder="速度" size="2" min="0" max="31" class="ivbox">
			</div>

			<label>最大个体值：</label>
			<div class="pla-control-spaced">
				<input type="number" id="maxhp" placeholder="HP" size="2" min="0" max="31" class="ivbox"> <input type="number" id="maxatk" placeholder="攻击" size="2" min="0" max="31" class="ivbox"> <input type="number" id="maxdef" placeholder="防御" size="2" min="0" max="31" class="ivbox"><input type="number" id="maxspa" placeholder="特攻" size="2" min="0" max="31" class="ivbox"> <input type="number" id="maxspd" placeholder="特防" size="2" min="0" max="31" class="ivbox"> <input type="number" id="maxspe" placeholder="速度" size="2" min="0" max="31" class="ivbox">
			</div>
			
			</div>
		
		<div class="pla-control">
			<label for="selectfilter">筛选条件：</label>
			<select id="selectfilter">
				<option value="no_filter">不筛选</option>
				<option value="is_shiny">仅闪光</option>
				<option value="is_square">仅方块闪光</option>
			</select>
		</div>
        
        <div class="pla-control-actions">
            <button class="pla-button pla-button-action" id="pla-button-checkwild">检查野生</button>
        </div>
    </section>

	<section>
        <!--<div class="pla-control-spaced">
            <label for="mmoShinyFilter">闪光或头目</label>
            <input type="checkbox" id="mmoShinyOrAlphaFilter">
        </div>-->
		

        <div class="pla-control-spaced">
            <label for="mmoShinyFilter">结果筛选：仅闪光</label>
            <input type="checkbox" id="mmoShinyFilter">
        </div>

        <!--<div class="pla-control-spaced">
            <label for="mmoAlphaFilter">结果筛选：仅头目</label>
            <input type="checkbox" id="mmoAlphaFilter">
        </div>-->
			<label for="naturefilter">结果筛选：性格</label>
			<select id="naturefilter" multiple class="chosen-select">
				<option value="any">任意</option>
				<option value="hardy">勤奋</option>
				<option value="lonely">怕寂寞</option>
				<option value="brave">勇敢</option>
				<option value="adamant">固执</option>
				<option value="naughty">顽皮</option>
				<option value="bold">大胆</option>
				<option value="docile">坦率</option>
				<option value="relaxed">悠闲</option>
				<option value="impish">淘气</option>
				<option value="lax">乐天</option>
				<option value="timid">胆小</option>
				<option value="hasty">急躁</option>
				<option value="serious">认真</option>
				<option value="jolly">爽朗</option>
				<option value="naive">天真</option>
				<option value="modest">内敛</option>
				<option value="mild">慢吞吞</option>
				<option value="quiet">冷静</option>
				<option value="bashful">害羞</option>
				<option value="rash">马虎</option>
				<option value="calm">温和</option>
				<option value="gentle">温顺</option>
				<option value="sassy">自大</option>
				<option value="careful">慎重</option>
				<option value="quirky">浮躁</option>
			</select>
			
		<label for="slotfilter">结果筛选：遭遇槽位</label>
		<select id="slotfilter" multiple class="chosen-select">
			<option value="any">任意</option>
			<option value=0>0</option>
			<option value=1>1</option>
			<option value=2>2</option>
			<option value=3>3</option>
			<option value=4>4</option>
			<option value=5>5</option>
			<option value=6>6</option>
			<option value=7>7</option>
			<option value=8>8</option>
			<option value=9>9</option>
			<option value=10>10</option>
			<option value=11>11</option>
		</select>
		
		<label for="genderfilter">结果筛选：性别</label>
		<select id="genderfilter">
			<option value=50>任意</option>
			<option value=0>雄性</option>
			<option value=1>雌性</option>
		</select>
		
		<div class="pla-control">
			<label for="genderratio">性别比例</label>
			<select id="genderratio">
				<option value="31" class="ivbox">1 &#9792; : 7 &#9794;</option>
				<option value="63">1 &#9792; : 4 &#9794;</option>
				<option value="127">1 &#9792; : 1 &#9794;</option>
				<option value="191">3 &#9792; : 1 &#9794;</option>
				<option value="0"> 仅 &#9794;</option>
				<option value="254"> 仅 &#9792;</option>
			</select>
		</div>
		
    </section>
{% endblock %}

{% block templates %}
    <template data-pla-results-template>
	<!--<details>
	<summary>Advance: <span data-pla-results-advances></span> Shiny: <span data-pla-results-shine></span> <span data-pla-results-spawn></span></summary>-->
        <div class="pla-results-item" data-pla-results-template>
            <ul class="pla-results-heading pla-results-ul">
                <li class="pla-results-sprite" data-pla-results-sprite></li>
                <li class="pla-results-species" data-pla-results-species></li>
				<li></li>
            </ul>
            
			<ul class="pla-results-ul">
				<li><span class="pla-results-label">帧数：</span> <span data-pla-results-adv></span></li>
				<li><span class="pla-results-label">槽位：</span> <span data-pla-results-slot></span></li>
				<li><span class="pla-results-label">闪光：</span> <span class="float -left" data-pla-results-shinysprite><span class="float -right" data-pla-results-shiny></span></span></li>
                <li><span class="pla-results-label">性格：</span> <span data-pla-results-nature></span></li>
                <li><span class="pla-results-label">性别：</span> <span data-pla-results-gender></span></li>			
                <li><span class="pla-results-label">特性：</span> <span data-pla-results-ability></span></li>
			</ul>
			<ul class="pla-results-ul">
                <li><span class="pla-results-label">PID：</span> <span data-pla-results-pid></span></li>
				<li><span class="pla-results-label">EC：</span> <span data-pla-results-ec></span></li>
            </ul>

            <div class="pla-results-ivs-container">
                <span class="pla-results-label">个体值：</span>
                <ul class="pla-results-ivs">
                    <li class="pla-results-ivs-hp" data-pla-results-ivs-hp></li>
                    <li class="pla-results-ivs-att" data-pla-results-ivs-att></li>
                    <li class="pla-results-ivs-def" data-pla-results-ivs-def></li>
                    <li class="pla-results-ivs-spa" data-pla-results-ivs-spa></li>
                    <li class="pla-results-ivs-spd" data-pla-results-ivs-spd></li>
                    <li class="pla-results-ivs-spe" data-pla-results-ivs-spe></li>
                </ul>
            </div>
         </div>
		 </template>
{% endblock %}

{% block script %}
    <script type="module" src="{{ url_for('static', filename='js/bwild.js') }}"></script>
{% endblock %}
