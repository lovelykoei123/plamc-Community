{% extends "base/base-sidebar.html" %}

{% block title %}设置{% endblock %}

{% block main %}
    <section class="pla-section flow">
        <h2>通用设置</h2>

        <div class="pla-control-spaced">
            <label for="pla-research-shinycharm">
                你是否拥有闪耀护符？
            </label>
            <input type="checkbox" id="pla-research-shinycharm">
        </div>
    </section>
    <section class="pla-section-results flow">
        <h2>研究等级</h2>

        <p>你可以一次性设置所有宝可梦的图鉴研究等级，也可以逐只单独设置，或直接从存档中读取。</p>

        <div data-pla-messages></div>

        <div>
            <input type="text" id="pla-research-filter" placeholder="筛选宝可梦...">
        </div>

        <div class="pla-research-table-container">
            <table class="pla-research-table">
                <colgroup>
                    <col class="pla-research-col1">
                    <col class="pla-research-col2">
                    <col class="pla-research-col3">
                    <col class="pla-research-col3">
                    <col class="pla-research-col3">
                </colgroup>
            </table>
        </div>
    </section>
{% endblock %}

{% block sidebar %}
    <section class="pla-section-options">

        <div class="pla-control-actions">
            <p>将所有宝可梦的研究等级设为：</p>
            <button type="button" class="pla-button" id="pla-research-set-base">基础等级</button>
            <button type="button" class="pla-button" id="pla-research-set-complete">等级 10</button>
            <button type="button" class="pla-button" id="pla-research-set-perfect">完美</button>
        </div>
		
    </section>
{% endblock %}

{% block templates %}
    <template data-pla-research-row-template>
        <tr class="pla-research-row">
            <td>
                <img alt="" data-pla-research-row-img>
            </td>
            <td class="pla-research-row-name">
            </td>
            <td>
                <label>
                    <input type="radio" class="pla-research-radio" value="0" checked /> 基础
                </label>
            </td>
            <td>
                <label>
                    <input type="radio" class="pla-research-radio" value="1" /> 等级 10
                </label>

            </td>
            <td>
                <label>
                    <input type="radio" class="pla-research-radio" value="3" /> 完美
                </label>
            </td>
        </tr>
    </template>
{% endblock %}

{% block script %}
    <script type="module" src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
