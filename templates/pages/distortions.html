{% extends "base/base-sidebar.html" %}

{% block title %}时空扭曲检查{% endblock %}

{% block main %}
    <section class="pla-section-results">
        <div data-pla-messages></div>
        <div class="pla-results" data-pla-results>
            <p class="pla-results-message">欢迎使用时空扭曲检查器。选择地图后就可以开始刷扭曲里的宝可梦了！</p>
        </div>
    </section>
{% endblock %}

{% block sidebar %}
    <section class="pla-section-options">
        <div class="pla-control">
            <label for="mapSelect">选择地图</label>
            <select id="mapSelect">
                <option value="obsidianfieldlands">黑曜原野</option>
                <option value="crimsonmirelands">红莲湿地</option>
                <option value="cobaltcoastlands">群青海岸</option>
                <option value="coronethighlands">天冠山麓</option>
                <option value="alabastericelands">纯白冻土</option>
            </select>
        </div>

        <div class="pla-control-spaced">
            <label for="distortionShinyFilter">闪光或头目</label>
            <input type="checkbox" id="distortionShinyOrAlphaFilter">
        </div>

        <div class="pla-control-spaced">
            <label for="distortionShinyFilter">仅闪光</label>
            <input type="checkbox" id="distortionShinyFilter">
        </div>

        <div class="pla-control-spaced">
            <label for="distortionAlphaFilter">仅头目</label>
            <input type="checkbox" id="distortionAlphaFilter">
        </div>

        <div class="pla-control-actions">
            <button type="button" class="pla-button pla-button-action" id="pla-button-check-distortions">检查时空扭曲</button>
            <button type="button" class="pla-button pla-button-action" id="pla-button-create-distortion">生成时空扭曲</button>
        </div>
    </section>

    <section class="pla-section-info">
        <h3>扭曲地点</h3>
        <ul class="pla-info-list" data-pla-info-locations>

        </ul>
        <h3>生成宝可梦</h3>
        <ul class="pla-info-list" data-pla-info-spawns>

        </ul>
    </section>
{% endblock %}

{% block templates %}
    <template data-pla-results-template>
        <div class="pla-results-item" data-pla-results-template>
            <ul class="pla-results-heading pla-results-ul">
                <li class="pla-results-sprite" data-pla-results-sprite></li>
                <li class="pla-results-species" data-pla-results-species></li>
                <li>位于 <span class="pla-results-location" data-pla-results-location></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">闪光：</span> <span class="float -left" data-pla-results-shinysprite><span class="float -right" data-pla-results-shiny></span></span></li>
                <li><span class="pla-results-label">头目：</span> <span data-pla-results-alpha></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">性格：</span> <span data-pla-results-nature></span></li>
                <li><span class="pla-results-label">性别：</span> <span data-pla-results-gender></span></li>
                <li><span class="pla-results-label">判定次数：</span> <span data-pla-results-rolls></span></li>
            </ul>

            <ul class="pla-results-ul">
                <li><span class="pla-results-label">种子：</span> <span data-pla-results-seed></span></li>
                <li><span class="pla-results-label">EC：</span> <span data-pla-results-ec></span></li>
                <li><span class="pla-results-label">PID：</span> <span data-pla-results-pid></span></li>
            </ul>

            <div class="pla-results-ivs-container">
                <span class="pla-results-label">个体值：</span>
                <ul class="pla-results-ivs">
                    <li class="pla-results-ivs-hp" data-pla-results-ivs-hp></li>
                    <li class="pla-results-ivs-att" data-pla-results-ivs-att></li>
                    <li class="pla-results-ivs-def" data-pla-results-ivs-def></li>
                    <li class="pla-results-ivs-spa" data-pla-results-ivs-spa></li>
                    <li class="pla-results-ivs-spd" data-pla-results-ivs-spd></li>
                    <li class="pla-results-ivs-spe" data-pla-results-ivs-spe></li>
                </ul>
            </div>
        </div>
    </template>
{% endblock %}

{% block script %}
    <script type="module" src="{{ url_for('static', filename='js/distortions.js') }}"></script>
{% endblock %}
